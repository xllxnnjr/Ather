name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies & build web app
        run: |
          bun install
          bun run build

      - name: Set up Capacitor & Android project
        run: |
          bun add -d @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.marvnpov.mynewapp",
            "appName": "MyNewApp",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          bunx cap add android
          bunx cap sync android

      - name: Enable Network & Cleartext Access in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          grep -q "ACCESS_NETWORK_STATE" "$MANIFEST" || sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>/' "$MANIFEST"

      - name: Generate App Icons
        run: |
          if [ -f "assets/icon.png" ]; then
            bunx capacitor-assets generate --android
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/*.apk
